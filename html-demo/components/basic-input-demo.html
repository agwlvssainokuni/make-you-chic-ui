<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>基本入力系コンポーネント デモ — Unit 2</title>
    <link rel="stylesheet" href="../assets/tokens.css" />
    <link rel="stylesheet" href="../assets/semantic.css" />
    <link rel="stylesheet" href="../assets/fonts.css" />
    <style>
      .demo-wrap {
        max-width: 480px;
        margin: var(--space-6) auto;
        padding: 0 var(--space-4);
        display: flex;
        flex-direction: column;
        gap: var(--space-4);
      }

      /* Button */
      .mycui-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        font-family: var(--font-family-active);
        font-weight: var(--font-weight-medium);
        border-radius: var(--radius-md);
        border: 1px solid transparent;
        cursor: pointer;
        font-size: var(--font-size-md);
        padding: var(--space-2) var(--space-4);
      }
      .mycui-button:focus-visible {
        outline: none;
        box-shadow: var(--focus-ring);
      }
      .mycui-button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }
      .mycui-button.variant-primary {
        background: var(--color-primary);
        color: #fff;
      }
      .mycui-button.variant-secondary {
        background: var(--color-surface);
        color: var(--color-text);
        border-color: var(--color-border);
      }

      /* FormField */
      .mycui-form-field {
        display: flex;
        flex-direction: column;
        gap: var(--space-1);
      }
      .mycui-form-field-label {
        font-size: var(--font-size-sm);
        font-weight: var(--font-weight-medium);
      }
      .mycui-form-field-error-text {
        font-size: var(--font-size-sm);
        color: var(--color-danger);
      }

      /* TextInput / Textarea / Select */
      .mycui-text-input,
      .mycui-textarea,
      .mycui-select {
        font-family: var(--font-family-active);
        font-size: var(--font-size-md);
        color: var(--color-text);
        background: var(--color-input-bg);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        padding: var(--space-2) var(--space-3);
      }
      .mycui-textarea {
        resize: vertical;
        width: 100%;
        box-sizing: border-box;
      }
      .mycui-text-input:focus-visible,
      .mycui-textarea:focus-visible,
      .mycui-select:focus-visible {
        outline: none;
        box-shadow: var(--focus-ring);
      }

      /* Checkbox / Switch / Radio (simplified static rendering for demo purposes) */
      .mycui-checkbox-label,
      .mycui-switch-label,
      .mycui-radio-label {
        display: inline-flex;
        align-items: center;
        gap: var(--space-2);
        font-size: var(--font-size-md);
        cursor: pointer;
      }
      .mycui-radio-group {
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
      }
    </style>
  </head>
  <body>
    <div class="demo-wrap">
      <h1 style="font-size: var(--font-size-xl); font-weight: var(--font-weight-semibold)">
        基本入力系デモ
      </h1>

      <div class="mycui-form-field">
        <label class="mycui-form-field-label" for="demo-name"
          >名前 <span aria-hidden="true" style="color: var(--color-danger)">*</span></label
        >
        <input class="mycui-text-input" id="demo-name" type="text" placeholder="山田 太郎" />
      </div>

      <div class="mycui-form-field">
        <label class="mycui-form-field-label" for="demo-email">メールアドレス</label>
        <input
          class="mycui-text-input"
          id="demo-email"
          type="text"
          aria-describedby="demo-email-error"
          aria-invalid="true"
        />
        <span class="mycui-form-field-error-text" id="demo-email-error" role="alert"
          >形式が正しくありません</span
        >
      </div>

      <div class="mycui-form-field">
        <label class="mycui-form-field-label" for="demo-bio">自己紹介</label>
        <textarea class="mycui-textarea" id="demo-bio" rows="3"></textarea>
      </div>

      <div class="mycui-form-field">
        <label class="mycui-form-field-label" for="demo-role">役割</label>
        <select class="mycui-select" id="demo-role">
          <option value="admin">管理者</option>
          <option value="member">一般ユーザー</option>
        </select>
      </div>

      <label class="mycui-checkbox-label">
        <input type="checkbox" />
        利用規約に同意する
      </label>

      <label class="mycui-switch-label">
        <input type="checkbox" role="switch" />
        通知を有効にする
      </label>

      <div class="mycui-radio-group" role="radiogroup" aria-label="アクセス権限">
        <label class="mycui-radio-label"
          ><input type="radio" name="demo-perm" value="read" checked /> 読み取りのみ</label
        >
        <label class="mycui-radio-label"
          ><input type="radio" name="demo-perm" value="write" /> 読み取り/書き込み</label
        >
      </div>

      <div>
        <button class="mycui-button variant-primary" type="button">保存</button>
        <button class="mycui-button variant-secondary" type="button">キャンセル</button>
      </div>
    </div>
  </body>
</html>
