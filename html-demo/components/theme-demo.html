<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>テーマ機能デモ — 基盤ユニット</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/semantic.css">
<link rel="stylesheet" href="../assets/fonts.css">
<style>
  .demo-panel { max-width: 640px; margin: var(--space-6) auto; padding: var(--space-4); }
  .demo-group { margin-bottom: var(--space-4); }
  .demo-group h2 { font-size: var(--font-size-md); font-weight: var(--font-weight-semibold); margin-bottom: var(--space-2); }
  .demo-buttons { display: flex; gap: var(--space-2); flex-wrap: wrap; }
  button.demo-btn {
    font-family: inherit;
    font-size: var(--font-size-sm);
    padding: var(--space-2) var(--space-3);
    border-radius: var(--radius-md);
    border: 1px solid var(--color-border);
    background: var(--color-surface);
    color: var(--color-text);
    cursor: pointer;
  }
  button.demo-btn:hover { background: var(--color-surface-hover); }
  button.demo-btn.active { border-color: var(--color-primary); color: var(--color-primary); background: var(--color-primary-subtle); }
  button.demo-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .demo-sample {
    margin-top: var(--space-4);
    padding: var(--space-4);
    border-radius: var(--radius-lg);
    border: 1px solid var(--color-border);
    background: var(--color-surface);
  }
</style>
</head>
<body>
  <div class="demo-panel">
    <h1 style="font-size: var(--font-size-xl); font-weight: var(--font-weight-semibold);">テーマ機能デモ</h1>

    <div class="demo-group">
      <h2>data-theme</h2>
      <div class="demo-buttons" data-axis="theme">
        <button class="demo-btn" data-value="light">light</button>
        <button class="demo-btn" data-value="dark">dark</button>
      </div>
    </div>

    <div class="demo-group">
      <h2>data-brand</h2>
      <div class="demo-buttons" data-axis="brand">
        <button class="demo-btn" data-value="blue">blue</button>
        <button class="demo-btn" data-value="green">green</button>
        <button class="demo-btn" data-value="purple">purple</button>
        <button class="demo-btn" data-value="orange">orange</button>
      </div>
    </div>

    <div class="demo-group">
      <h2>data-font-family</h2>
      <div class="demo-buttons" data-axis="fontFamily">
        <button class="demo-btn" data-value="sans">sans</button>
        <button class="demo-btn" data-value="serif">serif</button>
      </div>
    </div>

    <div class="demo-group">
      <h2>data-font-size</h2>
      <div class="demo-buttons" data-axis="fontSize">
        <button class="demo-btn" data-value="sm">sm</button>
        <button class="demo-btn" data-value="md">md</button>
        <button class="demo-btn" data-value="lg">lg</button>
      </div>
    </div>

    <div class="demo-sample">
      <p style="color: var(--color-primary); font-weight: var(--font-weight-semibold);">プライマリカラーのサンプルテキスト</p>
      <p>このパネルは選択したテーマ4軸に応じて配色・書体・文字サイズが変化します。別タブでこのページを開いて変更すると、他タブにも同期します。</p>
    </div>
  </div>

  <script>
    // Vanilla JS port of src/theme/{storage,validation,ThemeProvider}.ts
    // (Application Design Question 2 = A: React first, ported to HTML demo).
    var STORAGE_KEYS = {
      theme: 'design-system-theme',
      brand: 'design-system-brand',
      fontFamily: 'design-system-font-family',
      fontSize: 'design-system-font-size',
    };
    var VALID_VALUES = {
      theme: ['light', 'dark'],
      brand: ['blue', 'green', 'purple', 'orange'],
      fontFamily: ['sans', 'serif'],
      fontSize: ['sm', 'md', 'lg'],
    };
    var DEFAULTS = { theme: 'light', brand: 'blue', fontFamily: 'sans', fontSize: 'md' };

    function safeGet(key) {
      try { return window.localStorage.getItem(key); } catch (e) { return null; }
    }
    function safeSet(key, value) {
      try { window.localStorage.setItem(key, value); } catch (e) { /* ignore */ }
    }
    function isValid(axis, value) {
      return typeof value === 'string' && VALID_VALUES[axis].indexOf(value) !== -1;
    }
    function resolveInitial(axis, persisted, prefersDark) {
      if (isValid(axis, persisted)) return persisted;
      if (axis === 'theme') return prefersDark ? 'dark' : 'light';
      return DEFAULTS[axis];
    }

    function applyAttribute(name, value, omitWhen) {
      if (omitWhen !== undefined && value === omitWhen) {
        document.documentElement.removeAttribute(name);
      } else {
        document.documentElement.setAttribute(name, value);
      }
    }

    function applyAll(state) {
      applyAttribute('data-theme', state.theme, 'light');
      applyAttribute('data-brand', state.brand);
      applyAttribute('data-font-family', state.fontFamily);
      applyAttribute('data-font-size', state.fontSize);
      document.querySelectorAll('.demo-buttons').forEach(function (group) {
        var axis = group.getAttribute('data-axis');
        group.querySelectorAll('.demo-btn').forEach(function (btn) {
          btn.classList.toggle('active', btn.getAttribute('data-value') === state[axis]);
        });
      });
    }

    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var state = {
      theme: resolveInitial('theme', safeGet(STORAGE_KEYS.theme), prefersDark),
      brand: resolveInitial('brand', safeGet(STORAGE_KEYS.brand), prefersDark),
      fontFamily: resolveInitial('fontFamily', safeGet(STORAGE_KEYS.fontFamily), prefersDark),
      fontSize: resolveInitial('fontSize', safeGet(STORAGE_KEYS.fontSize), prefersDark),
    };
    applyAll(state);

    document.querySelectorAll('.demo-buttons').forEach(function (group) {
      var axis = group.getAttribute('data-axis');
      group.querySelectorAll('.demo-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var value = btn.getAttribute('data-value');
          state[axis] = value;
          safeSet(STORAGE_KEYS[axis], value);
          applyAll(state);
        });
      });
    });

    window.addEventListener('storage', function (event) {
      Object.keys(STORAGE_KEYS).forEach(function (axis) {
        if (event.key !== STORAGE_KEYS[axis]) return;
        state[axis] = resolveInitial(axis, event.newValue, prefersDark);
        applyAll(state);
      });
    });
  </script>
</body>
</html>
