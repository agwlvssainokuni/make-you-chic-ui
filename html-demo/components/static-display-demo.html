<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>静的表示系コンポーネント デモ — Unit 3</title>
    <link rel="stylesheet" href="../assets/tokens.css" />
    <link rel="stylesheet" href="../assets/semantic.css" />
    <link rel="stylesheet" href="../assets/fonts.css" />
    <style>
      .demo-wrap {
        max-width: 480px;
        margin: var(--space-6) auto;
        padding: 0 var(--space-4);
        display: flex;
        flex-direction: column;
        gap: var(--space-6);
      }
      .demo-row {
        display: flex;
        align-items: center;
        gap: var(--space-4);
      }

      .mycui-avatar {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: var(--color-primary-subtle);
        color: var(--color-primary);
        font-weight: var(--font-weight-semibold);
        overflow: hidden;
      }
      .mycui-avatar.size-sm {
        width: 24px;
        height: 24px;
        font-size: var(--font-size-sm);
      }
      .mycui-avatar.size-md {
        width: 36px;
        height: 36px;
        font-size: var(--font-size-md);
      }
      .mycui-avatar.size-lg {
        width: 56px;
        height: 56px;
        font-size: var(--font-size-lg);
      }

      .mycui-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 18px;
        height: 18px;
        padding: 0 var(--space-1);
        border-radius: 999px;
        font-size: var(--font-size-sm);
        font-weight: var(--font-weight-semibold);
        line-height: 1;
      }
      .mycui-badge.variant-primary {
        background: var(--color-primary);
        color: #fff;
      }
      .mycui-badge.variant-danger {
        background: var(--color-danger);
        color: #fff;
      }

      .mycui-card {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        padding: var(--space-4);
      }
    </style>
  </head>
  <body>
    <div class="demo-wrap">
      <h1 style="font-size: var(--font-size-xl); font-weight: var(--font-weight-semibold)">
        静的表示系デモ
      </h1>

      <section>
        <h2 style="font-size: var(--font-size-md); color: var(--color-text-muted)">Avatar</h2>
        <div class="demo-row">
          <div class="mycui-avatar size-sm" role="img" aria-label="山田 太郎">山太</div>
          <div class="mycui-avatar size-md" role="img" aria-label="山田 太郎">山太</div>
          <div class="mycui-avatar size-lg" role="img" aria-label="山田 太郎">山太</div>
        </div>
      </section>

      <section>
        <h2 style="font-size: var(--font-size-md); color: var(--color-text-muted)">Badge</h2>
        <div class="demo-row">
          <span class="mycui-badge variant-primary">3</span>
          <span class="mycui-badge variant-danger">99+</span>
        </div>
      </section>

      <section>
        <h2 style="font-size: var(--font-size-md); color: var(--color-text-muted)">Card</h2>
        <div class="mycui-card">
          <p style="margin: 0; font-weight: var(--font-weight-semibold)">カードタイトル</p>
          <p style="margin: var(--space-2) 0 0; color: var(--color-text-muted)">
            カード本文のサンプルテキストです。
          </p>
        </div>
      </section>
    </div>
  </body>
</html>
