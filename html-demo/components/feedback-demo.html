<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>フィードバック系コンポーネント デモ — Unit 4</title>
    <link rel="stylesheet" href="../assets/tokens.css" />
    <link rel="stylesheet" href="../assets/semantic.css" />
    <link rel="stylesheet" href="../assets/fonts.css" />
    <style>
      .demo-wrap {
        max-width: 480px;
        margin: var(--space-6) auto;
        padding: 0 var(--space-4);
        display: flex;
        flex-direction: column;
        gap: var(--space-4);
      }
      .wds-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        font-family: var(--font-family-active);
        font-weight: var(--font-weight-medium);
        border-radius: var(--radius-md);
        border: 1px solid transparent;
        cursor: pointer;
        font-size: var(--font-size-md);
        padding: var(--space-2) var(--space-4);
      }
      .wds-button.variant-primary {
        background: var(--color-primary);
        color: #fff;
      }
      .wds-button.variant-secondary {
        background: var(--color-surface);
        color: var(--color-text);
        border-color: var(--color-border);
      }
      .wds-button.variant-danger {
        background: var(--color-danger);
        color: #fff;
      }

      /* Modal */
      .wds-modal-overlay {
        position: fixed;
        inset: 0;
        background-color: var(--color-overlay);
        display: none;
        align-items: center;
        justify-content: center;
        padding: var(--space-4);
        z-index: 1000;
      }
      .wds-modal-overlay.open {
        display: flex;
      }
      .wds-modal-dialog {
        background: var(--color-surface);
        color: var(--color-text);
        border-radius: var(--radius-lg);
        max-width: 420px;
        width: 100%;
        outline: none;
        box-shadow: 0 10px 40px rgb(0 0 0 / 20%);
      }
      .wds-modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--space-4);
        border-bottom: 1px solid var(--color-border);
        font-weight: var(--font-weight-semibold);
      }
      .wds-modal-body {
        padding: var(--space-4);
      }

      /* Toast */
      .wds-toast-container {
        position: fixed;
        top: var(--space-4);
        right: var(--space-4);
        z-index: 2000;
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
      }
      .wds-toast {
        padding: var(--space-3) var(--space-4);
        border-radius: var(--radius-md);
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-left: 4px solid var(--color-success);
        box-shadow: 0 4px 16px rgb(0 0 0 / 15%);
        font-size: var(--font-size-sm);
      }

      /* Alert */
      .wds-alert {
        padding: var(--space-3) var(--space-4);
        border-radius: var(--radius-md);
        font-size: var(--font-size-sm);
        background: var(--color-danger-subtle);
        color: var(--color-danger);
      }

      /* Tooltip */
      .wds-tooltip-wrap {
        position: relative;
        display: inline-block;
      }
      .wds-tooltip {
        position: absolute;
        bottom: 130%;
        left: 50%;
        transform: translateX(-50%);
        background: var(--color-tooltip-bg);
        color: var(--color-tooltip-text);
        font-size: var(--font-size-sm);
        padding: var(--space-1) var(--space-2);
        border-radius: var(--radius-sm);
        white-space: nowrap;
        display: none;
      }
      .wds-tooltip-wrap:hover .wds-tooltip,
      .wds-tooltip-wrap:focus-within .wds-tooltip {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="demo-wrap">
      <h1 style="font-size: var(--font-size-xl); font-weight: var(--font-weight-semibold)">
        フィードバック系デモ
      </h1>

      <section>
        <h2 style="font-size: var(--font-size-md); color: var(--color-text-muted)">Modal</h2>
        <button class="wds-button variant-primary" id="open-modal-btn" type="button">
          確認Modalを開く
        </button>
      </section>

      <section>
        <h2 style="font-size: var(--font-size-md); color: var(--color-text-muted)">Toast</h2>
        <button class="wds-button variant-secondary" id="show-toast-btn" type="button">
          Toastを表示
        </button>
      </section>

      <section>
        <h2 style="font-size: var(--font-size-md); color: var(--color-text-muted)">Alert</h2>
        <div class="wds-alert" role="alert">入力内容にエラーがあります</div>
      </section>

      <section>
        <h2 style="font-size: var(--font-size-md); color: var(--color-text-muted)">Tooltip</h2>
        <span class="wds-tooltip-wrap">
          <button
            class="wds-button variant-secondary"
            type="button"
            aria-describedby="demo-tooltip"
          >
            ?
          </button>
          <span class="wds-tooltip" role="tooltip" id="demo-tooltip">補足説明を表示します</span>
        </span>
      </section>
    </div>

    <div class="wds-modal-overlay" id="demo-modal">
      <div
        class="wds-modal-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="demo-modal-title"
      >
        <div class="wds-modal-header">
          <span id="demo-modal-title">削除確認</span>
          <button
            type="button"
            id="close-modal-btn"
            aria-label="閉じる"
            style="background: none; border: none; cursor: pointer"
          >
            ×
          </button>
        </div>
        <div class="wds-modal-body">
          <p>この操作は取り消せません。よろしいですか?</p>
          <button class="wds-button variant-danger" type="button" id="confirm-modal-btn">
            削除する
          </button>
        </div>
      </div>
    </div>

    <div
      class="wds-toast-container"
      id="demo-toast-container"
      role="status"
      aria-live="polite"
    ></div>

    <script>
      var modal = document.getElementById('demo-modal')
      var openBtn = document.getElementById('open-modal-btn')
      var closeBtn = document.getElementById('close-modal-btn')
      var confirmBtn = document.getElementById('confirm-modal-btn')

      function openModal() {
        modal.classList.add('open')
        closeBtn.focus()
      }
      function closeModal() {
        modal.classList.remove('open')
        openBtn.focus()
      }
      openBtn.addEventListener('click', openModal)
      closeBtn.addEventListener('click', closeModal)
      confirmBtn.addEventListener('click', closeModal)
      modal.addEventListener('mousedown', function (e) {
        if (e.target === modal) closeModal()
      })
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && modal.classList.contains('open')) closeModal()
      })

      var toastContainer = document.getElementById('demo-toast-container')
      document.getElementById('show-toast-btn').addEventListener('click', function () {
        var toast = document.createElement('div')
        toast.className = 'wds-toast'
        toast.textContent = '保存しました'
        toastContainer.prepend(toast)
        setTimeout(function () {
          toast.remove()
        }, 4000)
      })
    </script>
  </body>
</html>
