<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Icon デモ — 基盤ユニット</title>
    <link rel="stylesheet" href="../assets/tokens.css" />
    <link rel="stylesheet" href="../assets/semantic.css" />
    <link rel="stylesheet" href="../assets/fonts.css" />
    <style>
      .icon-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: var(--space-4);
        max-width: 720px;
        margin: var(--space-6) auto;
        padding: 0 var(--space-4);
      }
      .icon-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-2);
        padding: var(--space-4);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        background: var(--color-surface);
        color: var(--color-text);
      }
      .icon-card svg {
        width: 24px;
        height: 24px;
        color: var(--color-primary);
      }
      .icon-card span {
        font-size: var(--font-size-sm);
        color: var(--color-text-muted);
      }
    </style>
  </head>
  <body>
    <h1
      style="
        text-align: center;
        font-size: var(--font-size-xl);
        font-weight: var(--font-weight-semibold);
      "
    >
      同梱アイコン一覧(Unit 1初期セット)
    </h1>
    <div class="icon-grid">
      <div class="icon-card">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M4 6h16M4 12h16M4 18h16"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <span>menu</span>
      </div>
      <div class="icon-card">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M6 9l6 6 6-6"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span>chevron-down</span>
      </div>
      <div class="icon-card">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M6 6l12 12M18 6L6 18"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <span>close</span>
      </div>
      <div class="icon-card">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M5 13l4 4L19 7"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span>check</span>
      </div>
      <div class="icon-card">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9z"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M13.73 21a2 2 0 01-3.46 0"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span>bell</span>
      </div>
      <div class="icon-card">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M20 21a8 8 0 10-16 0"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2" />
        </svg>
        <span>user</span>
      </div>
    </div>
  </body>
</html>
